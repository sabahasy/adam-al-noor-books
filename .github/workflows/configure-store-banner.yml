name: Configure Adam Al Noor store banner

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  configure-banner:
    if: contains(github.event.head_commit.message, 'Add store banner asset')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure banner and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = 'const STORE_BANNER_URL = "";'
          new = 'const STORE_BANNER_URL = "https://raw.githubusercontent.com/sabahasy/adam-al-noor-books/main/assets/adam-al-noor-banner.jpg";'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/configure-store-banner.yml
          git commit -m "Configure Adam Al Noor store banner"
          git push
