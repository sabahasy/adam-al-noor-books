<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adam Al-Noor Books</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f5f6fa;
    color: #222;
}

header {
    background: #171717;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #c9a227;
}

nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

nav button {
    border: none;
    padding: 10px 15px;
    margin: 3px;
    border-radius: 8px;
    cursor: pointer;
    background: #333;
    color: white;
    font-size: 14px;
}

nav button:hover {
    background: #c9a227;
}

.hero {
    background: linear-gradient(135deg, #171717, #45360b);
    color: white;
    padding: 60px 20px;
    text-align: center;
}

.hero h1 {
    font-size: 36px;
    margin: 0 0 15px;
}

.hero p {
    font-size: 18px;
    opacity: .9;
}

.container {
    max-width: 1150px;
    margin: auto;
    padding: 30px 20px;
}

.search {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 25px;
}

.section-title {
    margin: 25px 0 15px;
}

.categories {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.category {
    background: white;
    border: 1px solid #ddd;
    padding: 10px 18px;
    border-radius: 20px;
    cursor: pointer;
}

.category:hover {
    background: #c9a227;
    color: white;
}

.books {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.book {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    padding-bottom: 15px;
    transition: .2s;
}

.book:hover {
    transform: translateY(-4px);
}

.cover {
    height: 250px;
    background: linear-gradient(135deg, #222, #c9a227);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 55px;
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.book-content {
    padding: 15px;
}

.book h3 {
    margin: 5px 0 10px;
}

.author {
    color: #777;
    font-size: 14px;
}

.category-name {
    color: #999;
    font-size: 13px;
    margin-top: 5px;
}

.price {
    font-size: 20px;
    font-weight: bold;
    margin: 12px 0;
}

.book button {
    width: 100%;
    border: none;
    padding: 12px;
    border-radius: 8px;
    background: #171717;
    color: white;
    cursor: pointer;
    margin-top: 5px;
}

.book button:hover {
    background: #c9a227;
}

.buy-button {
    background: #c9a227 !important;
    color: #171717 !important;
}

.buy-button:hover {
    background: #171717 !important;
    color: white !important;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
    margin-top: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.form-group input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

.form-button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #171717;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

.form-button:hover {
    background: #c9a227;
}

.switch-button {
    margin-top: 12px;
    background: transparent;
    border: none;
    color: #8b6c00;
    cursor: pointer;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 15px;
    border-bottom: 1px solid #eee;
}

.cart-item:last-child {
    border-bottom: none;
}

.remove-button {
    background: #b3261e;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
}

.cart-total {
    font-size: 22px;
    font-weight: bold;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 2px solid #eee;
}

.checkout-button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 9px;
    background: #c9a227;
    cursor: pointer;
    font-size: 17px;
    font-weight: bold;
}

.checkout-button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.account-email {
    font-size: 18px;
    margin-bottom: 20px;
}

.logout-button {
    background: #b3261e;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
}

.empty {
    text-align: center;
    padding: 40px;
    color: #777;
}

.status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    background: #f5f5f5;
    display: none;
}

.status.error {
    background: #fff0f0;
    color: #b3261e;
}

.status.success {
    background: #effaf0;
    color: #26732a;
}

.library-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.library-card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.library-card .library-cover {
    height: 220px;
    background: linear-gradient(135deg, #222, #c9a227);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 50px;
}

.library-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.library-content {
    padding: 15px;
}

.read-button {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    background: #171717;
    color: white;
    text-decoration: none;
    text-align: center;
}

.read-button:hover {
    background: #c9a227;
}

footer {
    margin-top: 50px;
    background: #171717;
    color: white;
    text-align: center;
    padding: 30px;
}

@media (max-width: 600px) {

    header {
        justify-content: center;
        text-align: center;
    }

    .hero h1 {
        font-size: 28px;
    }

    .hero p {
        font-size: 16px;
    }

    .cart-item {
        flex-direction: column;
        align-items: stretch;
    }

}

</style>
</head>

<body>

<header>

<div class="logo">
Adam Al-Noor <span>Books</span>
</div>

<nav>

<button onclick="showPage('home')">
الرئيسية
</button>

<button onclick="showPage('library')">
مكتبتي
</button>

السلة 🛒 <span id="cartCount">0</span>
</button>

<!-- =====================================================
     الرئيسية
===================================================== -->

<section id="home" class="page active">

<section class="hero">

<h1>
مرحبًا بك في Adam Al-Noor Books

متجر الكتب الإلكترونية — اكتشف المعرفة واقرأ ما تحب
</p>

class="search"
id="search"
type="text"
placeholder="🔎 ابحث عن كتاب..."

>

التصنيفات

<div class="categories">

<button
class="category"
onclick="filterCategory('all')">

class="category"
onclick="filterCategory('التاريخ')">
التاريخ

<button
class="category"
onclick="filterCategory('الحضارات')">

<button
class="category"
onclick="filterCategory('الروايات')">

سجّل الدخول لمشاهدة مكتبتك.

</footer>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://smsqjmgbrkgxyhkaitao.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dOspOgRBDAG-KaxmAWha2g_MkBeY5fQ";


/* =====================================================
   إعدادات المتجر
===================================================== */

const USD_TO_IQD = 1310;


/* =====================================================
   الكتب الافتراضية
===================================================== */

const defaultBooks = [

{
id: "default-1",
title: "أعظم شخصيات تاريخية",
author: "Adam Al-Noor",
category: "التاريخ",
price: 5
},

{
id: "default-2",
title: "تاريخ الحضارات والأمم",
author: "Adam Al-Noor",
category: "الحضارات",
price: 6
},

{
id: "default-3",
title: "آخر ملوك الجان",
author: "Adam Al-Noor",
category: "الروايات",
price: 7
}

];


/* =====================================================
   المتغيرات
===================================================== */

let books = [...defaultBooks];

let currentBooks = [...books];

let cart = JSON.parse(
localStorage.getItem("adamAlNoorCart") || "[]"
);


/* =====================================================
   Access Token
===================================================== */

function getAccessToken() {

return localStorage.getItem(
"supabase_access_token"
) || "";

}


/* =====================================================
   عرض الكتب
===================================================== */

function renderBooks(list = currentBooks) {

const container =
document.getElementById("books");

if (!container) {
return;
}

if (!list || list.length === 0) {

container.innerHTML =
'<div class="empty">لم يتم العثور على كتب.</div>';

return;
}


container.innerHTML =
list.map(book => {

const realIndex =
books.findIndex(
item =>
String(item.id) === String(book.id)
);


let coverHTML =
'<div class="cover">📖</div>';

if (book.cover_url) {

coverHTML = `
<div class="cover">
<img
src="${escapeHTML(book.cover_url)}"
alt="${escapeHTML(book.title_ar || book.title || "كتاب")}"
>
</div>
`;

}


return `

<div class="book">

${coverHTML}

<div class="book-content">

<h3>
${escapeHTML(
book.title_ar ||
book.title ||
"كتاب"
)}
</h3>

<div class="author">

المؤلف:
${escapeHTML(
book.author_ar ||
book.auother_ar ||
book.author ||
"Adam Al-Noor"
)}

</div>

<div class="category-name">

التصنيف:
${escapeHTML(
book.category ||
"عام"
)}

</div>

<div class="price">

${Number(book.price || 0)} $

</div>


<button
onclick="addToCart(${realIndex})">

إضافة إلى السلة 🛒

</button>


<button
class="buy-button"
onclick="buyNow(${realIndex})">

شراء الآن

</button>

</div>

</div>

`;

}).join("");

}


/* =====================================================
   تحميل الكتب من Supabase
===================================================== */

async function loadBooks() {

try {

const response =
await fetch(
`${SUPABASE_URL}/rest/v1/books?select=*`,
{
method: "GET",

headers: {
"apikey": SUPABASE_KEY,
"Authorization":
`Bearer ${SUPABASE_KEY}`,
"Content-Type":
"application/json"
}
}
);


if (!response.ok) {

throw new Error(
"Supabase HTTP " +
response.status
);

}


const data =
await response.json();


console.log(
"Supabase books:",
data
);


if (
Array.isArray(data) &&
data.length > 0
) {

books = data;

}
else {

books = [...defaultBooks];

}


currentBooks =
[...books];

renderBooks();

}
catch(error) {

console.error(
"Supabase books error:",
error
);

books =
[...defaultBooks];

currentBooks =
[...books];

renderBooks();

}

}


/* =====================================================
   البحث
===================================================== */

function searchBooks() {

const input =
document.getElementById("search");

if (!input) {
return;
}

const value =
input.value.trim().toLowerCase();


currentBooks =
books.filter(book => {

const title =
String(
book.title_ar ||
book.title ||
""
).toLowerCase();


const author =
String(
book.author_ar ||
book.auother_ar ||
book.author ||
""
).toLowerCase();


return (
title.includes(value) ||
author.includes(value)
);

});


renderBooks();

}


/* =====================================================
   التصنيفات
===================================================== */

function filterCategory(category) {

if (category === "all") {

currentBooks =
[...books];

}
else {

currentBooks =
books.filter(book => {

const categoryName =
String(
book.category ||
""
);

return categoryName === category;

});

}

renderBooks();

}


/* =====================================================
   السلة
===================================================== */

function saveCart() {

localStorage.setItem(
"adamAlNoorCart",
JSON.stringify(cart)
);

updateCartCount();

}


/* =====================================================
   إضافة للسلة
===================================================== */

function addToCart(index) {

const book =
books[index];

if (!book) {
return;
}


const exists =
cart.some(
item =>
String(item.id) === String(book.id)
);


if (exists) {

alert(
"هذا الكتاب موجود بالفعل في السلة 🛒"
);

return;

}


cart.push(book);

saveCart();

renderCart();

alert(
"تمت إضافة الكتاب إلى السلة 🛒"
);

}


/* =====================================================
   شراء الآن
===================================================== */

function buyNow(index) {

const book =
books[index];

if (!book) {
return;
}


const exists =
cart.some(
item =>
String(item.id) === String(book.id)
);


if (!exists) {

cart.push(book);

saveCart();

}


showPage("cart");

}


/* =====================================================
   عرض السلة
===================================================== */

function renderCart() {

const container =
document.getElementById("cartItems");

const totalContainer =
document.getElementById("cartTotal");


if (!container || !totalContainer) {
return;
}


if (cart.length === 0) {

container.innerHTML =
'<div class="empty">السلة فارغة حاليًا.</div>';

totalContainer.innerHTML = "";

return;

}


container.innerHTML =
cart.map((book, index) => {

const title =
book.title_ar ||
book.title ||
"كتاب";


return `

<div class="cart-item">

<div>

<strong>
${escapeHTML(title)}
</strong>

<br>

<span>
${Number(book.price || 0)} $
</span>

</div>


<button
class="remove-button"
onclick="removeFromCart(${index})">

حذف

</button>

</div>

`;

}).join("");


const total =
cart.reduce(
(sum, book) =>
sum + Number(book.price || 0),
0
);


const totalIQD =
Math.round(
total * USD_TO_IQD
);


totalContainer.innerHTML = `

<div class="cart-total">

الإجمالي:
${total.toFixed(2)} $

<br>

<span style="font-size:14px;color:#777;">

ما يعادل تقريبًا
${totalIQD.toLocaleString("en-US")}
IQD

</span>

</div>

`;

}


/* =====================================================
   حذف
===================================================== */

function removeFromCart(index) {

cart.splice(index, 1);

saveCart();

renderCart();

}


/* =====================================================
   عداد السلة
===================================================== */

function updateCartCount() {

const counter =
document.getElementById("cartCount");

if (!counter) {
return;
}

counter.textContent =
cart.length;

}


/* =====================================================
   التنقل
===================================================== */

function showPage(pageId) {

document
.querySelectorAll(".page")
.forEach(page => {

page.classList.remove("active");

});


const page =
document.getElementById(pageId);


if (page) {

page.classList.add("active");

}


window.scrollTo({
top: 0,
behavior: "smooth"
});


if (pageId === "cart") {

renderCart();

}


if (pageId === "library") {

renderLibrary();

}


if (pageId === "account") {

checkUser();

}

}


/* =====================================================
   فحص المستخدم
===================================================== */

async function checkUser() {

const token =
getAccessToken();


if (!token) {

showLogin();

return;

}


try {

const response =
await fetch(
`${SUPABASE_URL}/auth/v1/user`,
{
method: "GET",

headers: {
"apikey":
SUPABASE_KEY,

"Authorization":
`Bearer ${token}`
}
}
);


if (!response.ok) {

localStorage.removeItem(
"supabase_access_token"
);

localStorage.removeItem(
"supabase_refresh_token"
);

showLogin();

return;

}


const user =
await response.json();


if (
user &&
user.email
) {

showLoggedUser(user);

}
else {

showLogin();

}

}
catch(error) {

console.error(
"CHECK USER ERROR:",
error
);

showLogin();

}

}


/* =====================================================
   تسجيل الدخول
===================================================== */

async function loginUser() {

const email =
document
.getElementById("loginEmail")
.value
.trim();


const password =
document
.getElementById("loginPassword")
.value;


const status =
document.getElementById(
"loginStatus"
);


if (!email || !password) {

showStatus(
status,
"أدخل البريد الإلكتروني وكلمة المرور.",
"error"
);

return;

}


try {

const response =
await fetch(
`${SUPABASE_URL}/auth/v1/token?grant_type=password`,
{
method: "POST",

headers: {
"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"
},

body:
JSON.stringify({
email,
password
})
}
);


const data =
await response.json();


if (!response.ok) {

throw new Error(
data.error_description ||
data.msg ||
data.message ||
"فشل تسجيل الدخول"
);

}


if (!data.access_token) {

throw new Error(
"لم يتم استلام Access Token."
);

}


localStorage.setItem(
"supabase_access_token",
data.access_token
);


localStorage.setItem(
"supabase_refresh_token",
data.refresh_token || ""
);


showLoggedUser(
data.user || {
email
}
);


showStatus(
status,
"تم تسجيل الدخول بنجاح ✅",
"success"
);

}
catch(error) {

console.error(

async function renderLibrary() {

const container =
document.getElementById(
"libraryItems"
);


if (!container) {
return;
}


const token =
getAccessToken();


if (!token) {

container.innerHTML = `

<div class="empty">

🔐 يجب تسجيل الدخول أولًا

<br><br>

<button
class="form-button"
onclick="showPage('account')">

تسجيل الدخول

</button>

</div>

`;

return;

}


container.innerHTML = `

<div class="empty">

⏳ جاري تحميل مكتبتك...

</div>

`;


try {

/*
   جلب المستخدم الحالي
*/

const userResponse =
await fetch(
`${SUPABASE_URL}/auth/v1/user`,
{
headers: {
"apikey":
SUPABASE_KEY,

"Authorization":
`Bearer ${token}`
}
}
);


if (!userResponse.ok) {

throw new Error(
"انتهت جلسة تسجيل الدخول."
);

}


const user =
await userResponse.json();


const userId =
user?.id;


if (!userId) {

throw new Error(
"لم يتم العثور على User ID."
);

}


/*
   جلب عناصر المكتبة مع بيانات الكتب
*/

const libraryUrl =
`${SUPABASE_URL}/rest/v1/library` +
`?select=id,user_id,book_id,order_id,purchased_at,books(*)` +
`&user_id=eq.${encodeURIComponent(userId)}` +
`&order= purchased_at.desc`;


const libraryResponse =
await fetch(
libraryUrl,
{
headers: {
"apikey":
SUPABASE_KEY,

"Authorization":
`Bearer ${token}`,

"Content-Type":
"application/json"
}
}
);


if (!libraryResponse.ok) {

const errorText =
await libraryResponse.text();

throw new Error(
"فشل تحميل المكتبة: " +
errorText
);

}


const data =
await libraryResponse.json();


if (
!Array.isArray(data) ||
data.length === 0
) {

container.innerHTML = `

<div class="empty">

📚 لا توجد كتب مشتراة حتى الآن.

<br><br>

بعد إتمام عملية شراء ناجحة،
سيظهر الكتاب هنا تلقائيًا.

</div>

`;

return;

}


container.innerHTML = `

<div class="library-grid">

${data.map(item => {

const book =
item.books || {};


const title =
book.title_ar ||
book.title ||
"كتاب";


const author =
book.author_ar ||
book.auother_ar ||
book.author ||
"Adam Al-Noor";


const cover =
book.cover_url || "";


const pdf =
book.pdf_url || "";


let coverHTML =
'<div class="library-cover">📖</div>';


if (cover) {

coverHTML = `

<div class="library-cover">

<img
src="${escapeHTML(cover)}"
alt="${escapeHTML(title)}"
>

</div>

`;

}


let buttonHTML = "";

if (pdf) {

buttonHTML = `

<a
class="read-button"
href="${escapeHTML(pdf)}"
target="_blank"
rel="noopener noreferrer">

📖 قراءة الكتاب

</a>

`;

}
else {

buttonHTML = `

<div class="empty"
style="padding:15px;">

ملف PDF غير متوفر حاليًا.

</div>

`;

}


return `

<div class="library-card">

${coverHTML}

<div class="library-content">

<h3>
${escapeHTML(title)}
</h3>

<div class="author">

المؤلف:
${escapeHTML(author)}

</div>

${buttonHTML}

</div>

</div>

`;

}).join("")}

</div>

`;

}
catch(error) {

console.error(
"LIBRARY ERROR:",
error
);


container.innerHTML = `

<div class="empty">

❌ تعذر تحميل مكتبتك.

<br><br>

${escapeHTML(
error.message ||
"حدث خطأ غير معروف."
)}

</div>

`;

}

}


/* =====================================================
   الدفع عبر Wayl
===================================================== */

async function checkout() {

if (!cart || cart.length === 0) {

alert(
"السلة فارغة."
);

return;

}


/*
   يجب تسجيل الدخول قبل الدفع
*/

const token =
getAccessToken();


if (!token) {

alert(
"يجب تسجيل الدخول أولًا قبل إتمام الشراء."
);

showPage("account");

return;

}


const checkoutButton =
document.getElementById(
"checkoutButton"
);


const status =
document.getElementById(
"checkoutStatus"
);


if (
checkoutButton &&
checkoutButton.disabled
) {

return;

}


/*
   حساب الإجمالي
*/

const totalUSD =
cart.reduce(
(sum, book) =>
sum + Number(book.price || 0),
0
);


const totalIQD =
Math.round(
totalUSD * USD_TO_IQD
);


if (
!Number.isInteger(totalIQD) ||
totalIQD <= 0
) {

showStatus(
status,
"تعذر حساب مبلغ الدفع.",
"error"
);

return;

}


/*
   إيقاف الزر
*/

if (checkoutButton) {

checkoutButton.disabled =
true;

checkoutButton.textContent =
"جاري إنشاء رابط الدفع...";

}


if (status) {

status.style.display =
"none";

}


/*
   بيانات الطلب
*/

const requestBody = {

items:
cart.map(book => ({

id:
book.id,

title:
book.title_ar ||
book.title ||
"كتاب",

price:
Number(book.price || 0)

})),

totalUSD:
totalUSD,

totalIQD:
totalIQD

};


console.log(
"CREATE PAYMENT REQUEST:",
requestBody
);


try {

const controller =
new AbortController();


const timeout =
setTimeout(
() => controller.abort(),
20000
);


const response =
await fetch(
"/api/create-payment",
{
method: "POST",

headers: {
"Content-Type":
"application/json",

"Accept":
"application/json",

"Authorization":
`Bearer ${token}`
},

body:
JSON.stringify(requestBody),

signal:
controller.signal
}
);


clearTimeout(timeout);


const rawText =
await response.text();


console.log(
"CREATE PAYMENT STATUS:",
response.status
);


console.log(
"CREATE PAYMENT RAW RESPONSE:",
rawText
);


let data;


try {

data =
JSON.parse(rawText);

}
catch {

throw new Error(
rawText ||
"خادم الدفع أعاد ردًا غير صالح."
);

}


if (!response.ok) {

throw new Error(
data?.error ||
data?.message ||
`فشل إنشاء رابط الدفع. HTTP ${response.status}`
);

}


const paymentUrl =
data?.paymentUrl ||
data?.data?.paymentUrl ||
data?.url ||
data?.data?.url;


if (
typeof paymentUrl !== "string" ||
!/^https?:\/\//i.test(paymentUrl)
) {

console.error(
"WAYL PAYMENT URL MISSING:",
data
);

throw new Error(
"تم إنشاء الطلب لكن لم يتم استلام رابط الدفع من Wayl."
);

}


/*
   حفظ الطلب المعلق
*/

localStorage.setItem(
"adamAlNoorPendingOrder",
JSON.stringify({

referenceId:
data?.referenceId ||
data?.data?.referenceId ||
"",

items:
cart,

totalUSD:
totalUSD,

totalIQD:
totalIQD,

paymentUrl:
paymentUrl,

userId:
null,

createdAt:
new Date().toISOString()

})
);


showStatus(
status,
"تم إنشاء الرابط ✓ جارٍ تحويلك إلى صفحة الدفع...",
"success"
);


if (checkoutButton) {

checkoutButton.textContent =
"تم إنشاء الرابط ✓";

}


console.log(
"REDIRECTING TO WAYL:",
paymentUrl
);


setTimeout(
() => {

window.location.replace(
paymentUrl
);

},
300
);


setTimeout(
() => {

if (
document.visibilityState ===
"visible"
) {

window.location.href =
paymentUrl;

}

},
2000
);

}
catch(error) {

console.error(
"CHECKOUT ERROR:",
error
);


if (
error?.name === "AbortError"
) {

showStatus(
status,
"انتهت مهلة الاتصال بخادم الدفع. حاول مرة أخرى.",
"error"
);

}
else {

showStatus(
status,
error?.message ||
"حدث خطأ أثناء إنشاء رابط الدفع.",
"error"
);

}


if (checkoutButton) {

checkoutButton.disabled =
false;

checkoutButton.textContent =
"إتمام الشراء";

}

}

}


/* =====================================================
   حماية النصوص
===================================================== */

function escapeHTML(value) {

return String(value ?? "")
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}
