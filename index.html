<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Adam Al-Noor Books</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Tahoma, sans-serif;
  background: #f5f6fa;
  color: #222;
}

header {
  background: #171717;
  color: white;
  padding: 18px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.logo span {
  color: #c9a227;
}

nav {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

nav button {
  border: none;
  padding: 10px 15px;
  margin: 3px;
  border-radius: 8px;
  cursor: pointer;
  background: #333;
  color: white;
  font-size: 14px;
}

nav button:hover {
  background: #c9a227;
}

.hero {
  background: linear-gradient(135deg, #171717, #45360b);
  color: white;
  padding: 60px 20px;
  text-align: center;
}

.hero h1 {
  font-size: 36px;
  margin: 0 0 15px;
}

.hero p {
  font-size: 18px;
  opacity: .9;
}

.container {
  max-width: 1150px;
  margin: auto;
  padding: 30px 20px;
}

.search {
  width: 100%;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  margin-bottom: 25px;
}

.section-title {
  margin: 25px 0 15px;
}

.categories {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.category {
  background: white;
  border: 1px solid #ddd;
  padding: 10px 18px;
  border-radius: 20px;
  cursor: pointer;
}

.category:hover {
  background: #c9a227;
  color: white;
}

.books {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.book {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow:
    0 4px 15px rgba(0,0,0,.08);
  padding-bottom: 15px;
  transition: .2s;
}

.book:hover {
  transform: translateY(-4px);
}

.cover {
  height: 250px;
  background:
    linear-gradient(135deg, #222, #c9a227);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 55px;
  overflow: hidden;
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.book-content {
  padding: 15px;
}

.book h3 {
  margin: 5px 0 10px;
}

.author {
  color: #777;
  font-size: 14px;
}

.category-name {
  color: #999;
  font-size: 13px;
  margin-top: 5px;
}

.price {
  font-size: 20px;
  font-weight: bold;
  margin: 12px 0;
}

.book button {
  width: 100%;
  border: none;
  padding: 12px;
  border-radius: 8px;
  background: #171717;
  color: white;
  cursor: pointer;
  margin-top: 5px;
}

.book button:hover {
  background: #c9a227;
}

.buy-button {
  background: #c9a227 !important;
  color: #171717 !important;
}

.buy-button:hover {
  background: #171717 !important;
  color: white !important;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.box {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow:
    0 4px 15px rgba(0,0,0,.06);
  margin-top: 20px;
}

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
}

.form-group input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
}

.form-button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: #171717;
  color: white;
  cursor: pointer;
  font-size: 16px;
}

.form-button:hover {
  background: #c9a227;
}

.switch-button {
  margin-top: 12px;
  background: transparent;
  border: none;
  color: #8b6c00;
  cursor: pointer;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 15px;
  border-bottom: 1px solid #eee;
}

.cart-item:last-child {
  border-bottom: none;
}

.remove-button {
  background: #b3261e;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 7px;
  cursor: pointer;
}

.cart-total {
  font-size: 22px;
  font-weight: bold;
  margin-top: 20px;
  padding-top: 15px;
  border-top: 2px solid #eee;
}

.checkout-button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 9px;
  background: #c9a227;
  cursor: pointer;
  font-size: 17px;
  font-weight: bold;
}

.checkout-button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.account-email {
  font-size: 18px;
  margin-bottom: 20px;
}

.logout-button {
  background: #b3261e;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
}

.empty {
  text-align: center;
  padding: 40px;
  color: #777;
}

.status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  background: #f5f5f5;
  display: none;
  white-space: pre-wrap;
  word-break: break-word;
}

.status.error {
  background: #fff0f0;
  color: #b3261e;
}

.status.success {
  background: #effaf0;
  color: #26732a;
}

.library-book {
  padding: 15px;
  border-bottom: 1px solid #eee;
}

.library-book:last-child {
  border-bottom: none;
}

.library-book button {
  margin-top: 10px;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  background: #171717;
  color: white;
  cursor: pointer;
}

footer {
  margin-top: 50px;
  background: #171717;
  color: white;
  text-align: center;
  padding: 30px;
}

@media (max-width: 600px) {

  header {
    justify-content: center;
    text-align: center;
  }

  .hero h1 {
    font-size: 28px;
  }

  .hero p {
    font-size: 16px;
  }

  .cart-item {
    flex-direction: column;
    align-items: stretch;
  }

}

</style>

</head>

<body>

     HEADER
===================================================== -->

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://smsqjmgbrkgxyhkaitao.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dOspOgRBDAG-KaxmAWha2g_MkBeY5fQ";


/* =====================================================
   إعدادات المتجر
===================================================== */

const CURRENCY = "IQD";


/* =====================================================
   لا توجد كتب افتراضية
===================================================== */


const defaultBooks = [
  {
    id: 1,
    title: "أعظم شخصيات تاريخية",
    author: "Adam Al-Noor",
    category: "التاريخ",
    price: 5
  },
  {
    id: 2,
    title: "تاريخ الحضارات والأمم",
    author: "Adam Al-Noor",
    category: "الحضارات",
    price: 6
  },
  {
    id: 3,
    title: "آخر ملوك الجان",
    author: "Adam Al-Noor",
    category: "الروايات",
    price: 7
  }
];

/* =====================================================
   المتغيرات
===================================================== */

let books = [];

let currentBooks = [];

let cart = JSON.parse(
  localStorage.getItem(
    "adamAlNoorCart"
  ) || "[]"
);


/* =====================================================
   حماية HTML
===================================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   عرض الكتب
===================================================== */

function renderBooks(
  list = currentBooks
) {

  const container =
    document.getElementById(
      "books"
    );

  if (!container) {
    return;
  }

  if (
    !Array.isArray(list) ||
    list.length === 0
  ) {

    container.innerHTML = `
      <div class="empty">
        لا توجد كتب متاحة حاليًا.
      </div>
    `;

    return;
  }

  container.innerHTML =
    list.map(book => {

      const realIndex =
        books.findIndex(
          item =>
            Number(item.id) ===
            Number(book.id)
        );

      const cover =
        book.cover_url
          ? `
            <img
              src="${escapeHTML(
                book.cover_url
              )}"
              alt="${escapeHTML(
                book.title
              )}"
            >
          `
          : "📖";

      return `

        <div class="book">

          <div class="cover">
            ${cover}
          </div>

          <div class="book-content">

            <h3>
              ${escapeHTML(
                book.title || "كتاب"
              )}
            </h3>

            <div class="author">
              المؤلف:
              ${escapeHTML(
                book.author ||
                "Adam Al-Noor"
              )}
            </div>

            <div class="category-name">
              التصنيف:
              ${escapeHTML(
                book.category ||
                "عام"
              )}
            </div>

            <div class="price">
              ${Number(
                book.price || 0
              ).toLocaleString(
                "en-US"
              )}
              د.ع
            </div>

            <button
              onclick="addToCart(${realIndex})"
            >
              إضافة إلى السلة 🛒
            </button>

            <button
              class="buy-button"
              onclick="buyNow(${realIndex})"
            >
              شراء الآن
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =====================================================
   تحميل التصنيفات
===================================================== */

async function loadCategories() {

  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/categories?select=id,name_ar`,
        {
          method: "GET",

          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${SUPABASE_KEY}`,

            "Content-Type":
              "application/json"
          }
        }
      );


    if (!response.ok) {
      return;
    }


    const data =
      await response.json();


    if (!Array.isArray(data)) {
      return;
    }


    const categoryMap = {};


    data.forEach(category => {

      categoryMap[
        String(category.id)
      ] =
        category.name_ar || "";

    });


    books =
      books.map(book => ({

        ...book,

        category:
          categoryMap[
            String(
              book.category_id
            )
          ] || ""

      }));


    currentBooks =
      [...books];


    renderBooks();

  }
  catch (error) {

    console.error(
      "CATEGORIES ERROR:",
      error
    );

  }

}


/* =====================================================
   تحميل الكتب من Supabase
===================================================== */

async function loadBooks() {

  const container =
    document.getElementById(
      "books"
    );


  try {

    console.log(
      "بدء تحميل الكتب من Supabase..."
    );


    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/books?select=id,title_ar,description_ar,author_ar,category_id,price,rating,cover_url,pdf_url,is_available,created_at,updated_at`,
        {
          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${SUPABASE_KEY}`,

            "Content-Type":
              "application/json"
          }
        }
      );


    const rawText =
      await response.text();


    console.log(
      "SUPABASE BOOKS STATUS:",
      response.status
    );


    console.log(
      "SUPABASE BOOKS RESPONSE:",
      rawText
    );


    if (!response.ok) {

      throw new Error(
        `Supabase HTTP ${response.status}: ${rawText}`
      );

    }


    let data;


    try {

      data =
        JSON.parse(
          rawText
        );

    }
    catch {

      throw new Error(
        "Supabase أعاد بيانات غير صالحة."
      );

    }


    if (
      !Array.isArray(data)
    ) {

      throw new Error(
        "بيانات الكتب ليست قائمة."
      );

    }


    console.log(
      "BOOKS FROM SUPABASE:",
      data
    );


    /* =================================================
       تحويل الكتب إلى الشكل المستخدم في الموقع
    ================================================= */

    books =
      data
        .filter(book => {

          const id =
            Number(book.id);

          return (
    Number.isSafeInteger(id) &&
    id > 0 &&
    book.is_available === true
);

        })
        .map(book => ({

          id:
            Number(book.id),

          title:
            book.title_ar ||
            "كتاب",

          description:
            book.description_ar ||
            "",

          author:
            book.author_ar ||
            "Adam Al-Noor",

          category_id:
            book.category_id,

          category:
            "",

          price:
            Number(book.price || 0),

          rating:
            Number(book.rating || 0),

          cover_url:
            book.cover_url ||
            "",

          pdf_url:
            book.pdf_url ||
            "",

          is_available:
            book.is_available !== false

        }));


    if (
      books.length === 0
    ) {

      throw new Error(
        "لم يتم العثور على كتب ذات IDs صحيحة في جدول books."
      );

    }


    /* =================================================
       تنظيف السلة القديمة
    ================================================= */

    cart =
      cart.filter(book => {

        const id =
          Number(book?.id);

        return (
          Number.isSafeInteger(id) &&
          id > 0
        );

      });


    /* =================================================
       إعادة ربط السلة بالكتب الحقيقية
    ================================================= */

    cart =
      cart
        .map(oldBook => {

          return books.find(
            book =>
              Number(book.id) ===
              Number(oldBook.id)
          ) || null;

        })
        .filter(Boolean);


    saveCart();


    currentBooks =
      [...books];


    renderBooks();


    await loadCategories();


    console.log(
      "FINAL BOOKS:",
      books
    );


    console.log(
      "FINAL CART:",
      cart
    );

  }
  catch (error) {

    console.error(
      "SUPABASE BOOKS ERROR:",
      error
    );


    books = [];

    currentBooks = [];

    cart = [];


    localStorage.removeItem(
      "adamAlNoorCart"
    );


    updateCartCount();


    if (container) {

      container.innerHTML = `

        <div class="empty">

          ⚠️ تعذر تحميل الكتب من قاعدة البيانات.

          <br><br>

          <small>
            ${escapeHTML(
              error?.message ||
              "خطأ غير معروف"
            )}
          </small>

        </div>

      `;

    }

  }

}


/* =====================================================
   البحث
===================================================== */

function searchBooks() {

  const input =
    document.getElementById(
      "search"
    );


  const value =
    input.value
      .trim()
      .toLowerCase();


  currentBooks =
    books.filter(book => {

      const title =
        String(
          book.title || ""
        ).toLowerCase();


      const author =
        String(
          book.author || ""
        ).toLowerCase();


      return (
        title.includes(value) ||
        author.includes(value)
      );

    });


  renderBooks();

}


/* =====================================================
   التصنيفات
===================================================== */

function filterCategory(
  category
) {

  if (
    category === "all"
  ) {

    currentBooks =
      [...books];

  }
  else {

    currentBooks =
      books.filter(
        book =>
          String(
            book.category || ""
          ) === category
      );

  }


  renderBooks();

}


/* =====================================================
   السلة
===================================================== */

function saveCart() {

  localStorage.setItem(
    "adamAlNoorCart",
    JSON.stringify(cart)
  );


  updateCartCount();

}


/* =====================================================
   إضافة إلى السلة
===================================================== */

function addToCart(index) {

  const book =
    books[index];


  if (!book) {

    alert(
      "الكتاب غير موجود."
    );

    return;

  }


  const bookId =
    Number(book.id);


  if (
    !Number.isSafeInteger(
      bookId
    ) ||
    bookId <= 0
  ) {

    alert(
      "معرّف الكتاب غير صحيح."
    );

    return;

  }


  if (
    book.is_available === false
  ) {

    alert(
      "هذا الكتاب غير متاح حاليًا."
    );

    return;

  }


  const exists =
    cart.some(
      item =>
        Number(item.id) ===
        bookId
    );


  if (exists) {

    alert(
      "هذا الكتاب موجود بالفعل في السلة 🛒"
    );

    return;

  }


  cart.push({

    id:
      bookId,

    title:
      book.title,

    author:
      book.author,

    price:
      Number(book.price),

    cover_url:
      book.cover_url || "",

    pdf_url:
      book.pdf_url || ""

  });


  saveCart();

  renderCart();


  alert(

/* =====================================================
   عرض السلة
===================================================== */

function renderCart() {

  const container =
    document.getElementById(
      "cartItems"
    );

  const totalContainer =
    document.getElementById(
      "cartTotal"
    );

  if (!container) {
    return;
  }

  if (
    !cart ||
    cart.length === 0
  ) {

    container.innerHTML =
      `
      <div class="empty">
        السلة فارغة حاليًا.
      </div>
      `;

    if (totalContainer) {
      totalContainer.innerHTML =
        "";
    }

    return;
  }

  container.innerHTML =
    cart.map(
      (book, index) => `

        <div class="cart-item">

          <div>

            <strong>
              ${escapeHTML(
                book.title ||
                "كتاب"
              )}
            </strong>

            <br>

            <span>
              ${Number(
                book.price || 0
              ).toLocaleString(
                "en-US"
              )}
              د.ع
            </span>

          </div>

          <button
            class="remove-button"
            onclick="removeFromCart(${index})"
          >
            حذف
          </button>

        </div>

      `
    ).join("");

  // =====================================================
  // الإجمالي بالدينار العراقي مباشرة
  // =====================================================

  const totalIQD =
    cart.reduce(
      (sum, book) =>
        sum +
        Number(
          book.price || 0
        ),
      0
    );

  if (totalContainer) {

    totalContainer.innerHTML = `

      <div class="cart-total">

        الإجمالي:
        ${totalIQD.toLocaleString(
          "en-US"
        )}
        د.ع

      </div>

    `;
  }

}


/* =====================================================
   حذف من السلة
===================================================== */

function removeFromCart(index) {

  if (
    index < 0 ||
    index >= cart.length
  ) {
    return;
  }


  cart.splice(
    index,
    1
  );


  saveCart();

  renderCart();

}

function showPage(
  pageId
) {

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove(
        "active"
      );

    });


  const page =
    document.getElementById(
      pageId
    );


  if (page) {

    page.classList.add(
      "active"
    );

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });


  if (
    pageId === "cart"
  ) {

    renderCart();

  }


  if (
    pageId === "library"
  ) {

    renderLibrary();

  }


  if (
    pageId === "account"
  ) {

    checkUser();

  }

}


/* =====================================================
   Access Token
===================================================== */

function getAccessToken() {

  return (
    localStorage.getItem(
      "supabase_access_token"
    ) || ""
  );

}


/* =====================================================
   التحقق من المستخدم
===================================================== */

async function checkUser() {

  const token =
    getAccessToken();


  if (!token) {

    showLogin();

    return;

  }


  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/auth/v1/user`,
        {

          method:
            "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`

          }

        }
      );


    if (!response.ok) {

      localStorage.removeItem(
        "supabase_access_token"
      );

      localStorage.removeItem(
        "supabase_refresh_token"
      );

      showLogin();

      return;

    }


    const user =
      await response.json();


    if (
      user &&
      user.email
    ) {

      showLoggedUser(
        user
      );

    }
    else {

      showLogin();

    }

  }
  catch (error) {

    console.error(
      "CHECK USER ERROR:",
      error
    );

    showLogin();

  }

}


/* =====================================================
   تسجيل الدخول
===================================================== */

async function loginUser() {

  const email =
    document
      .getElementById(
        "loginEmail"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;


  const status =
    document.getElementById(
      "loginStatus"
    );


  if (
    !email ||
    !password
  ) {

    showStatus(
      status,
      "أدخل البريد الإلكتروني وكلمة المرور.",
      "error"
    );

    return;

  }


  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
        {

          method:
            "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              email:
                email,

              password:
                password

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error_description ||
        data.msg ||
        data.message ||
        "فشل تسجيل الدخول"
      );

    }


    localStorage.setItem(
      "supabase_access_token",
      data.access_token
    );


    localStorage.setItem(
      "supabase_refresh_token",
      data.refresh_token || ""
    );


    showLoggedUser(
      data.user || {
        email:
          email
      }
    );


    alert(
      "تم تسجيل الدخول بنجاح ✅"
    );


    renderCart();

  }
  catch (error) {

    showStatus(
      status,
      error.message,
      "error"
    );

  }

}

/* =====================================================
   المكتبة
===================================================== */
async function renderLibrary() {

  const container =
    document.getElementById("libraryItems");

  if (!container) return;

  const token = getAccessToken();

  if (!token) {

    container.innerHTML = `
      <div class="empty">
        🔐 يجب تسجيل الدخول أولًا.
      </div>
    `;

    return;
  }

  container.innerHTML = `
    <div class="empty">
      جاري تحميل مكتبتك...
    </div>
  `;

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/library?select=id,book_id,order_id,purchased_at,books(id,title_ar,author_ar,pdf_url)&order=purchased_at.desc`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${token}`
        }
      }
    );

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const data = await response.json();

    if (!Array.isArray(data) || data.length === 0) {

      container.innerHTML = `
        <div class="empty">
          📚 لا توجد كتب مشتراة حتى الآن.
        </div>
      `;

      return;
    }

    let html = "";

    for (const item of data) {

      const book = item.books || {};

      const title =
        book.title_ar || "كتاب";

      const author =
        book.author_ar || "Adam Al-Noor";

      const filePath =
        String(book.pdf_url || "").trim();

      let readButton = `
        <div class="library-status">
          جاري تجهيز الكتاب...
        </div>
      `;

      html += `
        <div class="library-book">

          <strong>
            ${escapeHTML(title)}
          </strong>

          <br>

          <small>
            المؤلف:
            ${escapeHTML(author)}
          </small>

          <br>

          <div
            class="library-status"
            data-file="${escapeHTML(filePath)}"
          >
            جاري تجهيز الكتاب...
          </div>

        </div>
      `;
    }

    container.innerHTML = html;

    const bookElements =
      container.querySelectorAll(".library-book");

    for (const bookElement of bookElements) {

      const status =
        bookElement.querySelector(
          ".library-status"
        );

      const filePath =
        status?.dataset?.file || "";

      if (!filePath) {

        status.textContent =
          "ملف الكتاب غير متوفر حاليًا.";

        continue;
      }

      try {

        const pdfResponse =
          await fetch(
            "/api/library-pdf",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Authorization":
                  `Bearer ${token}`
              },

              body: JSON.stringify({
                filePath: filePath
              })
            }
          );

        const pdfText =
          await pdfResponse.text();

        if (!pdfResponse.ok) {

          throw new Error(
            `PDF API HTTP ${pdfResponse.status}: ${pdfText}`
          );

        }

        const pdfData =
          JSON.parse(pdfText);

        const finalUrl =
          pdfData?.url;

        if (!finalUrl) {

          throw new Error(
            "لم يتم الحصول على رابط الكتاب."
          );

        }

        status.innerHTML = `
          <button
            type="button"
            onclick="openPDF('${finalUrl.replace(/'/g, "\\'")}')"
          >
            📖 قراءة الكتاب
          </button>
        `;

      }
      catch (error) {

        console.error(
          "PDF API ERROR:",
          error
        );

        status.textContent =
          "تعذر تجهيز ملف الكتاب.";

        status.style.color =
          "#b3261e";
      }
    }

  }
  catch (error) {

    console.error(
      "LIBRARY ERROR:",
      error
    );

    container.innerHTML = `
      <div class="empty">
        ⚠️ تعذر تحميل المكتبة.
        <br><br>
        <small>
          ${escapeHTML(
            error?.message ||
            "خطأ غير معروف"
          )}
        </small>
      </div>
    `;
  }
}

function openPDF(
  url
) {

  if (
    !url ||
    !/^https?:\/\//i.test(
      url
    )
  ) {

    alert(
      "رابط الكتاب غير صالح."
    );

    return;

  }


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =====================================================
   CHECKOUT
===================================================== */

async function checkout() {

  /* ===================================================
     التأكد من السلة
  =================================================== */

  if (
    !cart ||
    cart.length === 0
  ) {

    alert(
      "السلة فارغة."
    );

    return;

  }


  /* ===================================================
     التأكد من تسجيل الدخول
  =================================================== */

  const accessToken =
    getAccessToken();


  if (!accessToken) {

    alert(
      "يجب تسجيل الدخول أولًا."
    );

    showPage(
      "account"
    );

    return;

  }


  /* ===================================================
     التحقق من الكتب
  =================================================== */

  for (
    const book of cart
  ) {

    const id =
      Number(book?.id);


    if (
      !Number.isSafeInteger(id) ||
      id <= 0
    ) {

      alert(
        "يوجد كتاب بمعرّف غير صحيح في السلة. تم تنظيف السلة."
      );


      cart =
        cart.filter(
          item => {

            const itemId =
              Number(item?.id);

            return (
              Number.isSafeInteger(
                itemId
              ) &&
              itemId > 0
            );

          }
        );


      saveCart();

      renderCart();

      return;

    }

  }


  /* ===================================================
     الزر والرسالة
  =================================================== */

  const checkoutButton =
    document.getElementById(
      "checkoutButton"
    );


  const status =
    document.getElementById(
      "checkoutStatus"
    );


  if (
    checkoutButton &&
    checkoutButton.disabled
  ) {

    return;

  }


  /* ===================================================
     حساب المبلغ بالدينار العراقي مباشرة
     لا يوجد تحويل من الدولار
  =================================================== */

  const totalIQD =
    cart.reduce(
      (sum, book) =>
        sum +
        Number(
          book.price || 0
        ),
      0
    );


  if (
    !Number.isInteger(
      totalIQD
    ) ||
    totalIQD <= 0
  ) {

    showStatus(
      status,
      "تعذر حساب مبلغ الدفع بالدينار العراقي.",
      "error"
    );

    return;

  }


  /* ===================================================
     حالة الانتظار
  =================================================== */

  if (checkoutButton) {

    checkoutButton.disabled =
      true;

    checkoutButton.textContent =
      "جاري إنشاء رابط الدفع...";

  }


  if (status) {

    status.style.display =
      "none";

  }


  /* ===================================================
     الطلب
     الخادم يعيد التحقق من الأسعار من Supabase
  =================================================== */

  const requestBody = {

    items:
      cart.map(book => ({

        id:
          Number(book.id)

      })),

    totalIQD:
      totalIQD

  };


  console.log(
    "CREATE PAYMENT REQUEST:",
    requestBody
  );


  try {

    /* ================================================
       مهلة 20 ثانية
    ================================================ */

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => {
          controller.abort();
        },
        20000
      );


    /* ================================================
       إرسال الطلب إلى Vercel
    ================================================ */

    const response =
      await fetch(
        "/api/create-payment",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Accept":
              "application/json",

            "Authorization":
              `Bearer ${accessToken}`

          },

          body:
            JSON.stringify(
              requestBody
            ),

          signal:
            controller.signal

        }
      );


    clearTimeout(
      timeout
    );


    /* ================================================
       قراءة الرد
    ================================================ */

    const rawText =
      await response.text();


    console.log(
      "CREATE PAYMENT STATUS:",
      response.status
    );


    console.log(
      "CREATE PAYMENT RAW RESPONSE:",
      rawText
    );


    let data;


    try {

      data =
        JSON.parse(
          rawText
        );

    }
    catch {

      throw new Error(
        rawText ||
        "خادم الدفع أعاد ردًا غير صالح."
      );

    }


    /* ================================================
       خطأ HTTP
    ================================================ */

    if (
      !response.ok
    ) {

      throw new Error(
        data?.error ||
        data?.message ||
        `فشل إنشاء رابط الدفع. HTTP ${response.status}`
      );

    }


    /* ================================================
       رابط Wayl
    ================================================ */

    const paymentUrl =
      data?.paymentUrl ||
      data?.data?.paymentUrl ||
      data?.url ||
      data?.data?.url;


    if (
      typeof paymentUrl !==
        "string" ||
      !/^https?:\/\//i.test(
        paymentUrl
      )
    ) {

      console.error(
        "WAYL PAYMENT URL MISSING:",
        data
      );


      throw new Error(
        "تم إنشاء الطلب لكن لم يتم استلام رابط الدفع من Wayl."
      );

    }


    /* ================================================
       حفظ الطلب مؤقتًا
    ================================================ */

    localStorage.setItem(
      "adamAlNoorPendingOrder",
      JSON.stringify({

        orderId:
          data?.orderId ||
          "",

        referenceId:
          data?.referenceId ||
          "",

        items:
          cart,

        totalIQD:
          totalIQD,

        paymentUrl:
          paymentUrl,

        createdAt:
          new Date().toISOString()

      })
    );


    /* ================================================
       رسالة نجاح
    ================================================ */

    showStatus(
      status,
      "تم إنشاء رابط الدفع ✓ جارٍ تحويلك إلى Wayl...",
      "success"
    );


    if (checkoutButton) {

      checkoutButton.textContent =
        "تم إنشاء الرابط ✓";

    }


    console.log(
      "REDIRECTING TO WAYL:",
      paymentUrl
    );


    /* ================================================
       الانتقال إلى Wayl
    ================================================ */

    setTimeout(
      () => {

        window.location.replace(
          paymentUrl
        );

      },
      300
    );


  }
  catch (error) {

    console.error(
      "CHECKOUT ERROR:",
      error
    );


    if (
      error?.name ===
      "AbortError"
    ) {

      showStatus(
        status,
        "انتهت مهلة الاتصال بخادم الدفع. حاول مرة أخرى.",
        "error"
      );

    }
    else {

      showStatus(
        status,
        error?.message ||
        "حدث خطأ أثناء إنشاء رابط الدفع.",
        "error"
      );

    }


    if (checkoutButton) {

      checkoutButton.disabled =
        false;

      checkoutButton.textContent =
        "إتمام الشراء";

    }

  }

}



/* =====================================================
   تشغيل الموقع
===================================================== */

renderBooks();

updateCartCount();

renderCart();

loadBooks();

checkUser();

</script>
