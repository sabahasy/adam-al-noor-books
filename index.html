/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://smsqjmgbrkgxyhkaitao.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dOspOgRBDAG-KaxmAWha2g_MkBeY5fQ";


/* =====================================================
   إعدادات المتجر
===================================================== */

const USD_TO_IQD = 1310;


/* =====================================================
   الكتب الأساسية
===================================================== */

const defaultBooks = [

{
id: "default-1",
title: "أعظم شخصيات تاريخية",
author: "Adam Al-Noor",
category: "التاريخ",
price: 5
},

{
id: "default-2",
title: "تاريخ الحضارات والأمم",
author: "Adam Al-Noor",
category: "الحضارات",
price: 6
},

{
id: "default-3",
title: "آخر ملوك الجان",
author: "Adam Al-Noor",
category: "الروايات",
price: 7
}

];


/* =====================================================
   المتغيرات
===================================================== */

let books = [...defaultBooks];

let currentBooks = [...books];

let cart = JSON.parse(
localStorage.getItem("adamAlNoorCart") || "[]"
);


/* =====================================================
   عرض الكتب
===================================================== */

function renderBooks(list = currentBooks) {

const container =
document.getElementById("books");

if (!container) {
return;
}

if (!list || list.length === 0) {

container.innerHTML =
'<div class="empty">لم يتم العثور على كتب.</div>';

return;
}

container.innerHTML = list.map((book) => {

const realIndex =
books.findIndex(
item => String(item.id) === String(book.id)
);

return `

<div class="book">

<div class="cover">
📖
</div>

<div class="book-content">

<h3>
${escapeHTML(book.title || "كتاب")}
</h3>

<div class="author">
المؤلف:
${escapeHTML(book.author || "Adam Al-Noor")}
</div>

<div class="category-name">
التصنيف:
${escapeHTML(book.category || "عام")}
</div>

<div class="price">
${Number(book.price || 0)} $
</div>

<button
onclick="addToCart(${realIndex})">
إضافة إلى السلة 🛒
</button>

<button
class="buy-button"
onclick="buyNow(${realIndex})">
شراء الآن
</button>

</div>

</div>

`;

}).join("");

}


/* =====================================================
   تحميل الكتب من Supabase
===================================================== */

async function loadBooks() {

try {

const response =
await fetch(
`${SUPABASE_URL}/rest/v1/books?select=*`,
{
method: "GET",

headers: {
"apikey": SUPABASE_KEY,
"Authorization": `Bearer ${SUPABASE_KEY}`,
"Content-Type": "application/json"
}

}
);

if (!response.ok) {

throw new Error(
"Supabase HTTP " + response.status
);

}

const data =
await response.json();

console.log(
"Supabase books:",
data
);

if (
Array.isArray(data) &&
data.length > 0
) {

books = data;

} else {

books = [...defaultBooks];

}

currentBooks = [...books];

renderBooks();

}

catch (error) {

console.error(
"Supabase error:",
error
);

books = [...defaultBooks];

currentBooks = [...books];

renderBooks();

}

}


/* =====================================================
   البحث
===================================================== */

function searchBooks() {

const input =
document.getElementById("search");

const value =
input.value.trim().toLowerCase();

currentBooks =
books.filter(book => {

const title =
String(book.title || "").toLowerCase();

const author =
String(book.author || "").toLowerCase();

return (
title.includes(value) ||
author.includes(value)
);

});

renderBooks();

}


/* =====================================================
   التصنيفات
===================================================== */

function filterCategory(category) {

if (category === "all") {

currentBooks =
[...books];

} else {

currentBooks =
books.filter(book =>
String(book.category || "") === category
);

}

renderBooks();

}


/* =====================================================
   السلة
===================================================== */

function saveCart() {

localStorage.setItem(
"adamAlNoorCart",
JSON.stringify(cart)
);

updateCartCount();

}


/* =====================================================
   إضافة للسلة
===================================================== */

function addToCart(index) {

const book =
books[index];

if (!book) {
return;
}

const exists =
cart.some(
item =>
String(item.id) === String(book.id)
);

if (exists) {

alert(
"هذا الكتاب موجود بالفعل في السلة 🛒"
);

return;
}

cart.push(book);

saveCart();

alert(
"تمت إضافة الكتاب إلى السلة 🛒"
);

renderCart();

}


/* =====================================================
   شراء الآن
===================================================== */

function buyNow(index) {

const book =
books[index];

if (!book) {
return;
}

const exists =
cart.some(
item =>
String(item.id) === String(book.id)
);

if (!exists) {

cart.push(book);

saveCart();

}

showPage("cart");

}


/* =====================================================
   عرض السلة
===================================================== */

function renderCart() {

const container =
document.getElementById("cartItems");

const totalContainer =
document.getElementById("cartTotal");

if (!container) {
return;
}

if (cart.length === 0) {

container.innerHTML =
'<div class="empty">السلة فارغة حاليًا.</div>';

totalContainer.innerHTML = "";

return;

}

container.innerHTML =
cart.map((book, index) => `

<div class="cart-item">

<div>

<strong>
${escapeHTML(book.title || "كتاب")}
</strong>

<br>

<span>
${Number(book.price || 0)} $
</span>

</div>

<button
class="remove-button"
onclick="removeFromCart(${index})">
حذف
</button>

</div>

`).join("");

const total =
cart.reduce(
(sum, book) =>
sum + Number(book.price || 0),
0
);

const totalIQD =
Math.round(total * USD_TO_IQD);

totalContainer.innerHTML = `

<div class="cart-total">
الإجمالي: ${total.toFixed(2)} $
<br>

<span style="font-size:14px;color:#777;">
ما يعادل تقريبًا
${totalIQD.toLocaleString("en-US")} IQD
</span>

</div>

`;

}


/* =====================================================
   حذف من السلة
===================================================== */

function removeFromCart(index) {

cart.splice(index, 1);

saveCart();

renderCart();

}


/* =====================================================
   عداد السلة
===================================================== */

function updateCartCount() {

const counter =
document.getElementById("cartCount");

if (!counter) {
return;
}

counter.textContent =
cart.length;

}


/* =====================================================
   التنقل
===================================================== */

function showPage(pageId) {

document
.querySelectorAll(".page")
.forEach(page => {

page.classList.remove("active");

});

const page =
document.getElementById(pageId);

if (page) {

page.classList.add("active");

}

window.scrollTo({
top: 0,
behavior: "smooth"
});

if (pageId === "cart") {
renderCart();
}

if (pageId === "library") {
renderLibrary();
}

if (pageId === "account") {
checkUser();
}

}


/* =====================================================
   حساب المستخدم
===================================================== */

async function checkUser() {

const token =
getAccessToken();

if (!token) {

showLogin();

return;
}

try {

const response =
await fetch(
`${SUPABASE_URL}/auth/v1/user`,
{
headers: {
"apikey": SUPABASE_KEY,
"Authorization":
`Bearer ${token}`
}
}
);

if (!response.ok) {

showLogin();

return;
}

const user =
await response.json();

if (user && user.email) {

showLoggedUser(user);

} else {

showLogin();

}

}
catch {

showLogin();

}

}


/* =====================================================
   Access Token
===================================================== */

function getAccessToken() {

return localStorage.getItem(
"supabase_access_token"
) || "";

}


/* =====================================================
   تسجيل الدخول
===================================================== */

async function loginUser() {

const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;

const status =
document.getElementById("loginStatus");

if (!email || !password) {

showStatus(
status,
"أدخل البريد الإلكتروني وكلمة المرور.",
"error"
);

return;

}

try {

const response =
await fetch(
`${SUPABASE_URL}/auth/v1/token?grant_type=password`,
{
method: "POST",

headers: {
"apikey": SUPABASE_KEY,
"Content-Type":
"application/json"
},

body: JSON.stringify({
email: email,
password: password
})

}
);

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.error_description ||
data.msg ||
"فشل تسجيل الدخول"
);

}

localStorage.setItem(
"supabase_access_token",
data.access_token
);

localStorage.setItem(
"supabase_refresh_token",
data.refresh_token || ""
);

showLoggedUser(
data.user || { email: email }
);

alert(
"تم تسجيل الدخول بنجاح ✅"
);

}
catch (error) {

showStatus(
status,
error.message,
"error"
);

}

}


/* =====================================================
   إنشاء حساب
===================================================== */

async function signupUser() {

const email =
document
.getElementById("signupEmail")
.value
.trim();

const password =
document
.getElementById("signupPassword")
.value;

const status =
document.getElementById("signupStatus");

if (!email || !password) {

showStatus(
status,
"أدخل البريد الإلكتروني وكلمة المرور.",
"error"
);

return;

}

if (password.length < 6) {

showStatus(
status,
"يجب أن تكون كلمة المرور 6 أحرف على الأقل.",
"error"
);

return;

}

try {

const response =
await fetch(
`${SUPABASE_URL}/auth/v1/signup`,
{
method: "POST",

headers: {
"apikey": SUPABASE_KEY,
"Content-Type":
"application/json"
},

body: JSON.stringify({
email: email,
password: password
})

}
);

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.msg ||
data.error_description ||
"فشل إنشاء الحساب"
);

}

if (data.access_token) {

localStorage.setItem(
"supabase_access_token",
data.access_token
);

localStorage.setItem(
"supabase_refresh_token",
data.refresh_token || ""
);

showLoggedUser(
data.user || {email: email}
);

alert(
"تم إنشاء الحساب وتسجيل الدخول بنجاح ✅"
);

} else {

showStatus(
status,
"تم إنشاء الحساب. تحقق من بريدك الإلكتروني ثم سجّل الدخول.",
"success"
);

}

}
catch (error) {

showStatus(
status,
error.message,
"error"
);

}

}


/* =====================================================
   المستخدم المسجل
===================================================== */

function showLoggedUser(user) {

document.getElementById(
"loginBox"
).style.display = "none";

document.getElementById(
"signupBox"
).style.display = "none";

document.getElementById(
"userBox"
).style.display = "block";

document.getElementById(
"userEmail"
).textContent =
user.email || "";

}


/* =====================================================
   تسجيل الخروج
===================================================== */

async function logoutUser() {

try {

await fetch(
`${SUPABASE_URL}/auth/v1/logout`,
{
method: "POST",

headers: {
"apikey": SUPABASE_KEY,
"Authorization":
`Bearer ${getAccessToken()}`
}
}
);

}
catch {}

localStorage.removeItem(
"supabase_access_token"
);

localStorage.removeItem(
"supabase_refresh_token"
);

showLogin();

alert(
"تم تسجيل الخروج."
);

}


/* =====================================================
   واجهة تسجيل الدخول
===================================================== */

function showLogin() {

document.getElementById(
"loginBox"
).style.display = "block";

document.getElementById(
"signupBox"
).style.display = "none";

document.getElementById(
"userBox"
).style.display = "none";

}


/* =====================================================
   واجهة إنشاء الحساب
===================================================== */

function showSignup() {

document.getElementById(
"loginBox"
).style.display = "none";

document.getElementById(

element,
message,
type = ""
) {

if (!element) {
return;
}

element.textContent =
message;

element.className =
"status " + type;

element.style.display =
"block";

}

/* =====================================================
   الدفع عبر Wayl
===================================================== */

async function checkout() {

if (!cart || cart.length === 0) {

alert("السلة فارغة.");

return;

}

const checkoutButton =
document.getElementById(
"checkoutButton"
);

const status =
document.getElementById(
"checkoutStatus"
);


/* منع الضغط المتكرر */

if (
checkoutButton &&
checkoutButton.disabled
) {

return;

}


/* حساب المجموع بالدولار */

const totalUSD =
cart.reduce(
(sum, book) =>
sum + Number(book.price || 0),
0
);


/* تحويل إلى IQD */

const totalIQD =
Math.round(
totalUSD * USD_TO_IQD
);


if (
!Number.isInteger(totalIQD) ||
totalIQD <= 0
) {

showStatus(
status,
"تعذر حساب مبلغ الدفع.",
"error"
);

return;

}


/* حالة الانتظار */

if (checkoutButton) {

checkoutButton.disabled =
true;

checkoutButton.textContent =
"جاري إنشاء رابط الدفع...";

}

if (status) {

status.style.display =
"none";

}


/* البيانات المرسلة إلى API */

const requestBody = {

items:
cart.map(book => ({

id:
book.id,

title:
book.title,

price:
Number(book.price || 0)

})),

totalUSD:
totalUSD,

totalIQD:
totalIQD

};

console.log(
"CREATE PAYMENT REQUEST:",
requestBody
);


try {

/*
   مهلة 20 ثانية
*/

const controller =
new AbortController();

const timeout =
setTimeout(
() => controller.abort(),
20000
);


/*
   إنشاء رابط الدفع
*/

const response =
await fetch(
"/api/create-payment",
{
method: "POST",

headers: {
"Content-Type":
"application/json",

"Accept":
"application/json"
},

body:
JSON.stringify(requestBody),

signal:
controller.signal
}
);

clearTimeout(timeout);


/*
   نقرأ الرد كنص أولًا.
*/

const rawText =
await response.text();

console.log(
"CREATE PAYMENT STATUS:",
response.status
);

console.log(
"CREATE PAYMENT RAW RESPONSE:",
rawText
);


/*
   تحويل JSON
*/

let data;

try {

data =
JSON.parse(rawText);

}
catch (jsonError) {

console.error(
"API JSON PARSE ERROR:",
jsonError
);

throw new Error(
rawText
? "خادم الدفع أعاد ردًا غير صالح."
: "خادم الدفع لم يُرجع أي بيانات."
);

}


/*
   فحص HTTP
*/

if (!response.ok) {

throw new Error(
data?.error ||
data?.message ||
`فشل إنشاء رابط الدفع. HTTP ${response.status}`
);

}


/*
   استخراج رابط Wayl
*/

const paymentUrl =
data?.paymentUrl ||
data?.data?.paymentUrl ||
data?.url ||
data?.data?.url;


/*
   التأكد من الرابط
*/

if (
typeof paymentUrl !== "string" ||
!/^https?:\/\//i.test(paymentUrl)
) {

console.error(
"WAYL PAYMENT URL MISSING:",
data
);

throw new Error(
"تم إنشاء الطلب لكن لم يتم استلام رابط الدفع من Wayl."
);

}


/*
   حفظ الطلب مؤقتًا
*/

localStorage.setItem(
"adamAlNoorPendingOrder",
JSON.stringify({

referenceId:
data?.referenceId ||
data?.data?.referenceId ||
"",

items:
cart,

totalUSD:
totalUSD,

totalIQD:
totalIQD,

paymentUrl:
paymentUrl,

createdAt:
new Date().toISOString()

})
);


/*
   عرض رسالة نجاح
*/

showStatus(
status,
"تم إنشاء الرابط ✓ جارٍ تحويلك إلى صفحة الدفع...",
"success"
);


/*
   تغيير الزر
*/

if (checkoutButton) {

checkoutButton.textContent =
"تم إنشاء الرابط ✓";

}


/*
   الانتقال إلى Wayl
*/

console.log(
"REDIRECTING TO WAYL:",
paymentUrl
);


/*
   نستخدم location.replace
   بدل assign حتى لا تبقى صفحة الدفع
   في سجل الرجوع بشكل غير ضروري.
*/

setTimeout(
function() {

window.location.replace(
paymentUrl
);

},
300
);


/*
   حماية إضافية:
   إذا لم ينفذ المتصفح التحويل خلال 2 ثانية،
   نحاول مرة أخرى.
*/

setTimeout(
function() {

if (
document.visibilityState === "visible"
) {

console.log(
"WAYL REDIRECT RETRY:",
paymentUrl
);

window.location.href =
paymentUrl;

}

},
2000
);

}
catch (error) {

console.error(
"CHECKOUT ERROR:",
error
);

if (
error?.name === "AbortError"
) {

showStatus(
status,
"انتهت مهلة الاتصال بخادم الدفع. حاول مرة أخرى.",
"error"
);

}
else {

showStatus(
status,
error?.message ||
"حدث خطأ أثناء إنشاء رابط الدفع.",
"error"
);

}

if (checkoutButton) {

checkoutButton.disabled =
false;

checkoutButton.textContent =
"إتمام الشراء";

}

}

}


/* =====================================================
   حماية النصوص
===================================================== */

function escapeHTML(value) {

return String(value)
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}
